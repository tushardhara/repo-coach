# RepoCoach LoRA training config (research-backed defaults)
# Docs: https://github.com/ml-explore/mlx-lm/blob/main/mlx_lm/LORA.md

# Paths are set at runtime by 06_train.sh (model, data, adapter_path, iters)
fine_tune_type: lora
num_layers: 8                 # auto-adjusted down to 4 for tiny datasets

# Research-backed: lower LR reduces catastrophic forgetting (Dialzara 2025;
# typical 5e-6 to 5e-5, 2e-5 effective across models)
learning_rate: 2.0e-5

batch_size: 2
val_batches: 10
steps_per_eval: 50
steps_per_report: 10
save_every: 100
max_seq_length: 512
grad_checkpoint: true

lora_parameters:
  rank: 4
  scale: 20.0
  dropout: 0.05               # small dropout = extra regularization on small data
