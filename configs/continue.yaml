name: RepoCoach Local
version: 1.0.0
schema: v1
models:
  # Your fine-tuned model — fast repo-aware autocomplete
  - name: RepoCoach Autocomplete
    provider: ollama
    model: YOUR_REPO-coder       # ← replace YOUR_REPO with your repo name
    apiBase: http://localhost:11434
    roles:
      - autocomplete
      - chat
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
context:
  - provider: code
  - provider: codebase
  - provider: diff
  - provider: terminal
